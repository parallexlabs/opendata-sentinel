<text x="12" y="140" font-size="11" transform="rotate(-90 12,140)">Defined run mean</text>
<rect x="60" y="100" width="90" height="120" fill="#2563eb"/>
<line x1="105" y1="76" x2="105" y2="124" stroke="#1e3a8a" stroke-width="2"/>
<text x="105" y="240" text-anchor="middle" font-size="10">Schema-only</text>
<text x="105" y="94" text-anchor="middle" font-size="10">0.75</text>
<rect x="185" y="79" width="90" height="141" fill="#2563eb"/>
<line x1="230" y1="60" x2="230" y2="108" stroke="#1e3a8a" stroke-width="2"/>
<text x="230" y="240" text-anchor="middle" font-size="10">Relations</text>
