name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements-tested.txt ".[dev,benchmark]"
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Secret scan
        run: gitleaks detect --source . --no-banner --redact
      - name: Path and style hygiene
        run: |
          ! rg -n '/Users/' --glob '!*.md' .
          ! rg -n $'\u2014' docs README.md RESULTS.md
          python scripts/prepare_public_import.py --scan-public-refs
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy src
      - name: Pyright
        run: pyright src
      - name: Pytest
        run: pytest --cov=civic_data_qa --cov-report=term-missing --cov-fail-under=90 -m "not network"
      - name: MkDocs build
        run: mkdocs build --strict
      - name: Demo checks
        run: |
          civic-data-qa check samples/demo.csv --config examples/demo.csv.yml
          civic-data-qa check samples/local-area-boundary.geojson --config examples/local-area-boundary.yml --output "$RUNNER_TEMP/local-area-results.json"
      - name: Wheel smoke install
        run: |
          python scripts/wheel_smoke.py
