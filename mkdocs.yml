site_name: OpenData Sentinel
site_description: Civic open-data quality assurance
repo_url: https://github.com/parallexlabs/opendata-sentinel
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Inspectable workflow: case-study.md
  - Release verification: release-verification.md
  - Benchmark: benchmark.md
  - Configuration: configuration.md
  - Check catalogue: checks.md
  - Results: results.md
  - Technical report: technical-report.md
  - Adjudication sheet: ADJUDICATION_SHEET.md
  - Data licences: DATA_LICENCES.md
  - Sample provenance: sample-provenance.md
  - Network policy: network-policy.md
  - API reference: api.md
docs_dir: docs
theme:
  name: material
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            heading_level: 2
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
